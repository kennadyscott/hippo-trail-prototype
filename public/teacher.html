<body style="margin:0">
<title>KnowHippo Teacher Intervention</title>

<style>
/* Layout: the KnowHippo teacher shell (purple rail, airy work area) with Crystal Reports patterns: filters, icon tabs, stat cards, band legend, small groups. Single light theme to match the live teacher app. */
:root{
  --rail-1:#3b1a7a; --rail-2:#6a3fb5; --rail-active:#22104a; --rail-ink:#f2edff; --rail-gold:#f6b94a;
  --bg:#f5f6fc; --bg-top:#e9f3fb; --ink:#1d1b3a; --ink-2:#4b4870; --muted:#7a779a; --line:#ebe7f6; --card:#ffffff;
  --purple:#6d28d9; --purple-2:#8b5cf6; --lav:#efe9ff; --lav-2:#f6f2ff; --teal:#0fa38d; --teal-bg:#e6f7f3;
  --b-on:#3cb878; --b-near:#3aa7dd; --b-mid:#f0a436; --b-far:#e9457a; --b-none:#e6e3ef;
  --font:"Nunito","Avenir Next","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid #a78bfa;outline-offset:2px}
.app{display:flex;min-height:100vh}
/* rail */
.rail{width:224px;flex:none;background:linear-gradient(170deg,var(--rail-1),var(--rail-2) 70%,#7c55c4);color:var(--rail-ink);padding:18px 12px;padding-left:max(12px,env(safe-area-inset-left,0px))}
.logo{display:flex;align-items:center;gap:6px;margin:2px 6px 26px}
.logo svg{flex:none}
.logo b{font-size:22px;font-weight:900;letter-spacing:-1px;color:#fff;text-shadow:0 2px 0 #2a1060}
.rail-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid #ffffff1a;font-size:14px;font-weight:600;color:var(--rail-ink)}
.rail-item svg{width:18px;height:18px}
.rail-item.static{opacity:.92}
.rail-item.active{background:var(--rail-active);border-radius:6px;border-bottom-color:transparent;color:var(--rail-gold)}
.rail-item .tag{margin-left:auto;font-size:9.5px;font-weight:900;letter-spacing:.8px;background:var(--rail-gold);color:#2a1060;border-radius:5px;padding:2px 7px}
/* main */
.main{flex:1;min-width:0;background:linear-gradient(180deg,var(--bg-top),var(--bg) 220px)}
.topstrip{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:20px 26px 0;padding-right:max(26px,env(safe-area-inset-right,0px))}
.burger{width:44px;height:44px;border-radius:50%;border:1.5px solid #4b4870;display:grid;place-items:center;background:transparent}
.user{background:#fff;border-radius:0 0 12px 12px;box-shadow:0 6px 20px #2a10600f;padding:14px 18px;min-width:290px}
.user-top{display:flex;gap:12px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.avatar{width:42px;height:42px;border-radius:50%;background:#f9d4ef;display:grid;place-items:center;font-weight:800}
.user b{display:block;font-size:16px}.user small{color:var(--ink-2);font-size:14px}
.user .school{padding-top:10px;font-size:15px}
.content{padding:24px 30px 60px;padding-left:max(30px,env(safe-area-inset-left,0px));padding-right:max(30px,env(safe-area-inset-right,0px));max-width:1500px}
.head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.wordmark{display:flex;align-items:center;gap:12px}
.wordmark .mark{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#1aa6c4,#6d28d9);display:grid;place-items:center}
.wordmark h1{margin:0;font-size:34px;font-weight:900;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(90deg,#1a8fb3,#6d28d9);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.05}
.wordmark small{display:block;font-size:13px;color:var(--ink-2);font-weight:700;letter-spacing:.3px;text-transform:none;-webkit-text-fill-color:var(--ink-2)}
.head-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 16px;font-weight:800;color:var(--purple);cursor:pointer;font-size:14.5px}
.btn:hover{background:var(--lav-2)}
.btn.solid{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.solid:hover{background:#5b21b6}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.name-pick{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--ink-2)}
.name-pick select{border:1px solid #d9cdfb;border-radius:8px;background:var(--lav-2);color:var(--purple);font-weight:800;padding:5px 8px}
.filters{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.3fr;gap:12px;margin-bottom:14px;max-width:1340px}
.filters label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:800;color:#34315a}
.filters select{height:48px;border:1px solid #e1ddf0;border-radius:8px;background:#fff;padding:0 14px;font-size:16px;font-weight:800}
.tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;margin-bottom:16px;overflow-x:auto}
.tab{display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:9px;border:0;background:none;font-size:16px;font-weight:700;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{background:var(--lav);color:var(--purple);box-shadow:inset 0 -3px var(--purple)}
.cards3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;gap:16px;align-items:center;min-width:0}
.stat.tint{background:linear-gradient(135deg,#f4f0ff,#e9f8f6)}
.stat .ic{flex:none;width:54px;height:54px;display:grid;place-items:center}
.stat small{display:block;color:var(--ink-2);font-size:14.5px;font-weight:600}
.stat b{display:block;white-space:nowrap;font-size:30px;font-weight:900;letter-spacing:-.5px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat a,.stat .sub{font-size:12.5px;color:var(--purple);font-weight:700}
.banner{display:flex;gap:16px;align-items:center;background:linear-gradient(90deg,#f3eeff,#f8f6ff);border:1px solid #e3d9fb;border-radius:16px;padding:16px 20px;margin-bottom:16px;flex-wrap:wrap}
.banner .i{flex:none;width:36px;height:36px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;font-weight:900}
.banner h3{margin:0;font-size:17.5px;font-weight:900}
.banner p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.banner .grow{flex:1;min-width:240px}
.sugg{width:100%;display:grid;gap:8px;margin-top:4px}
.sugg-row{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;flex-wrap:wrap}
.sugg-row b{min-width:110px}
.sugg-row span{flex:1;color:var(--ink-2);font-size:14px;min-width:200px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;min-width:0}
.card h2{margin:0;font-size:23px;font-weight:900;letter-spacing:-.2px}
.card .sub{color:var(--ink-2);font-size:13.5px;margin:3px 0 14px}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.legend span{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13.5px;font-weight:700}
.legend i{width:16px;height:16px;border-radius:50%}
.legend .ring{background:#fff!important;border:3px solid var(--purple)}
.zrow{display:grid;grid-template-columns:200px minmax(0,1fr) 120px;gap:16px;align-items:center;padding:13px 0;border-bottom:1px solid #f2eff9;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.zrow:hover{background:#fbfaff}
.zrow b{font-size:16px}
.zbar{display:flex;height:16px;border-radius:9px;overflow:hidden;background:var(--b-none)}
.zbar i{display:block;height:100%}
.zrow .cnt{color:var(--purple);font-size:13.5px;font-weight:700;text-align:right}
.group{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.group-head{display:flex;gap:10px;align-items:center;justify-content:space-between}
.group-head b{font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px}
.count-pill{background:var(--lav);color:var(--purple);font-weight:900;font-size:13px;border-radius:12px;padding:2px 9px}
.group p{margin:6px 0 0;font-size:13.5px;color:var(--ink-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid #e3dcf8;background:var(--lav-2);color:var(--ink);border-radius:20px;padding:4px 11px;font-size:13px;font-weight:700;cursor:pointer}
.chip:hover{border-color:var(--purple-2)}
/* heat map */
.zone-pills{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.zp{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font-size:13.5px;font-weight:800;color:var(--ink-2);cursor:pointer}
.zp[aria-pressed=true]{background:var(--purple);border-color:var(--purple);color:#fff}
.scroll{overflow-x:auto}
table.heat{border-collapse:separate;border-spacing:4px;min-width:640px}
.heat th{font-size:12px;font-weight:800;color:var(--ink-2);text-align:center;padding:4px;vertical-align:bottom;line-height:1.2;min-width:74px}
.heat th:first-child{text-align:left;min-width:150px}
.heat td.name{font-weight:800;font-size:14.5px;padding-right:8px;white-space:nowrap}
.heat td.name button{border:0;background:none;padding:0;font-weight:800;cursor:pointer;color:var(--ink)}
.heat td.name button:hover{color:var(--purple);text-decoration:underline}
.cell{height:36px;border-radius:8px;text-align:center;font-weight:800;font-size:13.5px;font-variant-numeric:tabular-nums;color:#1d1b3a}
.cell.on{background:#dcf3e6;color:#1d7a4a}.cell.near{background:#d9eefa;color:#1b6b95}.cell.mid{background:#fde9c8;color:#8a5208}.cell.far{background:#fbd5e1;color:#a3174a}
.cell.trail{box-shadow:inset 0 0 0 3px var(--purple)}
/* tables */
table.list{border-collapse:collapse;width:100%;min-width:760px}
.list th{font-size:12.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:800}
.list td{padding:12px;border-bottom:1px solid #f3f0fa;font-size:14.5px;vertical-align:middle}
.list tr.click{cursor:pointer}.list tr.click:hover{background:#fbfaff}
.num{text-align:right;font-variant-numeric:tabular-nums}
.cat-chip{display:inline-block;border-radius:7px;background:var(--lav-2);border:1px solid #e3dcf8;padding:3px 8px;font-size:12.5px;font-weight:800;margin:2px 4px 2px 0;white-space:nowrap}
.cat-chip.done{background:var(--teal-bg);border-color:#bde9df;color:#0b7766}
.gain{font-weight:900;color:var(--teal)}
.status{font-size:12.5px;font-weight:800;border-radius:12px;padding:3px 9px;white-space:nowrap}
.status.go{background:var(--teal-bg);color:#0b7766}.status.check{background:#fff3df;color:#8a5208}
/* student */
.back{border:0;background:none;color:var(--purple);font-weight:800;cursor:pointer;padding:0;margin-bottom:10px;font-size:14.5px}
.claim{font-size:28px;font-weight:900;letter-spacing:-.4px;margin:6px 0 4px;text-wrap:balance;color:#2a1060}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}
.kpi{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi small{display:block;font-size:12.5px;color:var(--ink-2);font-weight:700}
.kpi b{white-space:nowrap;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.prog{display:grid;grid-template-columns:200px minmax(0,1fr) 90px;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid #f3f0fa}
.prog-track{position:relative;height:18px;border-radius:9px;background:#f1eef8}
.prog-track .seg{position:absolute;top:0;height:18px;border-radius:9px;background:linear-gradient(90deg,#b9a6f5,#6d28d9)}
.prog-track .goal{position:absolute;top:-4px;width:2px;height:26px;background:#1d1b3a}
.prog small{display:block;color:var(--muted);font-size:12px}
.sched{display:grid;gap:8px}
.sched div{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px}
/* drawer */
dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100vw - 32px));box-shadow:0 30px 80px #2a106040}
dialog::backdrop{background:#2a106055}
.dlg{padding:22px}
.dlg h2{margin:0 0 4px;font-size:22px;font-weight:900}
.dlg .pick{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px;margin:12px 0;display:grid;grid-template-columns:1fr 1fr;gap:2px}
.dlg .pick label{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;font-weight:700;font-size:14.5px}
.dlg .pick label:hover{background:var(--lav-2)}
.dlg select{width:100%;height:44px;border:1px solid #e1ddf0;border-radius:8px;padding:0 12px;font-weight:700}
.dlg .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.note{font-size:13px;color:var(--ink-2);margin:8px 0 0}
.toast{position:fixed;bottom:max(22px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#2a1060;color:#fff;font-weight:800;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px #2a106040;z-index:20}
.example{font-size:12.5px;color:#8a5208;background:#fff6e5;border:1px solid #fbe2b2;border-radius:10px;padding:8px 12px;margin-bottom:14px}
@media(max-width:1200px){.grid2{grid-template-columns:1fr}.cards3{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:1fr 1fr}}
@media(max-width:760px){
  .app{display:block}.rail{width:100%;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .logo{margin:0 0 10px}.logo b{font-size:24px}
  .rail-nav{display:flex;gap:6px;overflow-x:auto}.rail-item{border:0;padding:8px 12px;font-size:14px;white-space:nowrap}.rail-item.static{display:none}
  .topstrip{padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}.user{min-width:0;flex:1}.burger{display:none}
  .content{padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
  .wordmark h1{font-size:24px}.cards3,.filters,.kpis{grid-template-columns:1fr 1fr}.stat{padding:14px}.stat b{font-size:26px}.stat .ic{display:none}
  .zrow{grid-template-columns:1fr;gap:6px}.zrow .cnt{text-align:left}.prog{grid-template-columns:1fr;gap:6px}
  .dlg .pick{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
.pt-switch{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;background:#1d1240;color:#fff;padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));font:700 13px/1.3 Nunito,Arial,Helvetica,sans-serif;position:relative;z-index:60}
.pt-switch b{color:#c4b5fd;text-transform:uppercase;letter-spacing:.8px;font-size:11px}
.pt-switch span{color:#a99cd6}
.pt-switch a{color:#fff;text-decoration:none;border:1px solid #ffffff40;border-radius:999px;padding:3px 12px;font-weight:800}
.pt-switch a:hover{background:#ffffff18}
.pt-switch a[aria-current=page]{background:#8b5cf6;border-color:#8b5cf6}
.pt-switch small{margin-left:auto;color:#a99cd6;font-size:11.5px}
</style>

  </section>
  <div style="display:grid;gap:16px"><section class="card"><h2 style="font-size:19px">Working on now</h2><div class="sched" style="margin-top:10px">${cur || '<p class="note">Nothing open right now.</p>'}</div></section>
    <section class="card"><h2 style="font-size:19px">Spiral review coming up</h2><p class="sub">Passed skills come back so they stay fresh</p><div class="sched">${spiral.map(([k, d]) => `<div><span>${esc(k)}</span><b>${d}</b></div>`).join('')}</div></section>
    <section class="card"><h2 style="font-size:19px">By Texas standard</h2><div class="sched" style="margin-top:10px">${[['2.2A','Passed'],['2.2B','Passed'],['3.2A','Working on it'],['3.2B','Not yet']].map(([c, st]) => `<div><span><b style="color:var(--purple)">${c}</b> ${esc((DATA.std[c] || '').slice(0, 60))}…</span><span class="status ${st === 'Passed' ? 'go' : 'check'}">${st}</span></div>`).join('')}</div></section></div></div>`;
}

/* ---------- assign dialog ---------- */
function openAssign(preset){
  const d = document.getElementById('assign');
  d.innerHTML = `<form class="dlg" method="dialog" id="assign-form"><h2 id="assign-title">Assign ${esc(P())}</h2><p class="note" style="margin:0">Pick students and a category. A short Hippo Check runs first to find where each student starts; their other categories stay in grade-level work.</p>
    <div class="pick">${STU.map(s => `<label><input type="checkbox" name="stu" value="${s.name}"${preset === s.name ? ' checked' : ''}>${s.name}</label>`).join('')}</div>
    <label for="assign-cat" style="font-weight:800;font-size:13.5px">Category</label><select id="assign-cat"><option value="ALL">All math categories</option>${ZONES.map(z => `<optgroup label="${esc(z)}">${DATA.cats.filter(c => c.zone === z).map(c => `<option value="${c.code}">${esc(c.name)}</option>`).join('')}</optgroup>`).join('')}</select>
    <div class="row"><button class="btn ghost" value="cancel" formnovalidate>Cancel</button><button class="btn solid" value="ok" id="assign-go">Assign</button></div></form>`;
  d.showModal();
  document.getElementById('assign-go').onclick = e => {
    e.preventDefault();
    const names = [...d.querySelectorAll('input[name=stu]:checked')].map(i => i.value);
    if (!names.length) { toast('Pick at least one student.'); return; }
    const c = document.getElementById('assign-cat').value;
    names.forEach(n => { const s = S(n); const cats = c === 'ALL' ? DATA.cats.filter(x => band(x.code, s.g[x.code]) !== 'on').map(x => x.code) : [c]; cats.forEach(code => { if (!inTrail(s, code)) s.trail.push({c:code, placed:s.g[code], start:'Nov', by:'teacher'}); }); if (s.suggest && (c === 'ALL' || c === s.suggest.c)) s.suggest = null; if (!s.week.some(Boolean)) { s.week = [0,0,0,0]; s.hours = 0; s.last = 'Hippo Check next'; s.spiral = 100; } });
    d.close(); render(); toast(`Assigned ${names.length} student${names.length > 1 ? 's' : ''}. Hippo Check is next.`);
  };
}
let toastTimer;
function toast(t){ const el = document.getElementById('toast'); el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2600); }

/* ---------- render & events ---------- */
function render(){
  renderRail();
  document.getElementById('content').innerHTML = shell(student ? studentView(student) : VIEWS[tab]());
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; student = null; render(); scrollTo(0, 0); return; }
  const st = e.target.closest('[data-student]'); if (st) { student = st.dataset.student; render(); scrollTo(0, 0); return; }
  const zo = e.target.closest('[data-zone-open]'); if (zo) { zoneSel = zo.dataset.zoneOpen; render(); document.querySelector('.heat')?.scrollIntoView({behavior:'smooth', block:'center'}); return; }
  const z = e.target.closest('[data-zone]'); if (z) { zoneSel = z.dataset.zone; render(); return; }
  if (e.target.closest('#open-assign')) { openAssign(); return; }
  const one = e.target.closest('#assign-one'); if (one) { openAssign(one.dataset.name); return; }
  const add = e.target.closest('[data-add]'); if (add) { const s = S(add.dataset.add); s.trail.push({c:s.suggest.c, placed:s.g[s.suggest.c], start:'Nov', by:'auto'}); s.week = [0,0,0,0]; s.hours = 0; s.last = 'Hippo Check next'; s.spiral = 100; const n = s.name; s.suggest = null; render(); toast(`${n} added. Hippo Check is next.`); return; }
  const skip = e.target.closest('[data-skip]'); if (skip) { S(skip.dataset.skip).suggest = null; render(); toast('Noted. You can still assign other students any time.'); return; }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('tr.click')) e.target.click(); });
document.addEventListener('change', e => { if (e.target.id === 'pname') { PNAME = e.target.value; try { localStorage.setItem('hippo-trail-name', PNAME); } catch (err) {} render(); } });
render();
</script>
